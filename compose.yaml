name: plantops-demo

x-backend-environment: &backend-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__PlantOps: Host=database;Port=5432;Database=plantops;Username=plantops;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Docker env file};GSS Encryption Mode=Disable
  Documents__StorageRoot: /var/lib/plantops/documents
  Telemetry__SimulationEnabled: ${TELEMETRY_SIMULATION_ENABLED:-true}
  Telemetry__RawRetentionDays: ${TELEMETRY_RAW_RETENTION_DAYS:-7}
  Telemetry__MinuteRetentionDays: ${TELEMETRY_MINUTE_RETENTION_DAYS:-90}
  Outbox__RetentionEnabled: ${OUTBOX_RETENTION_ENABLED:-false}
  Outbox__SentRetentionHours: ${OUTBOX_SENT_RETENTION_HOURS:-24}
  Outbox__CleanupBatchSize: ${OUTBOX_CLEANUP_BATCH_SIZE:-1000}
  Outbox__CleanupIntervalSeconds: ${OUTBOX_CLEANUP_INTERVAL_SECONDS:-5}
  AI__Provider: ${AI_PROVIDER:-Fake}
  AI__BaseUrl: ${AI_BASE_URL:-}
  AI__Model: ${AI_MODEL:-}
  AI__ApiKey: ${AI_API_KEY:-}
  AI__MaxInputTokens: ${AI_MAX_INPUT_TOKENS:-32000}
  AI__MaxOutputTokens: ${AI_MAX_OUTPUT_TOKENS:-6000}
  AI__StreamResponses: ${AI_STREAM_RESPONSES:-true}
  AI__RequestTimeoutSeconds: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
  AI__RunTimeoutSeconds: ${AI_RUN_TIMEOUT_SECONDS:-600}
  AI__ServerRenderedFacts: ${AI_SERVER_RENDERED_FACTS:-true}

services:
  database:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: plantops
      POSTGRES_USER: plantops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Docker env file}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantops -d plantops"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  db-init:
    image: plantops-worker:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: worker
    profiles: [tools]
    environment:
      <<: *backend-environment
      Demo__Password: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in the Docker env file}
    command: ["--initialize-db"]
    volumes:
      - documents:/var/lib/plantops/documents
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: plantops-api:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: api
    environment:
      <<: *backend-environment
    volumes:
      - documents:/var/lib/plantops/documents
      - api-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: plantops-worker:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: worker
    environment:
      <<: *backend-environment
      AI__Diagnostics__CaptureResponses: ${AI_DIAGNOSTICS_CAPTURE_RESPONSES:-true}
      AI__Diagnostics__StorageRoot: /var/lib/plantops/investigation-diagnostics
      AI__Diagnostics__RetentionDays: ${AI_DIAGNOSTICS_RETENTION_DAYS:-7}
      AI__Diagnostics__MaxTotalBytes: ${AI_DIAGNOSTICS_MAX_TOTAL_BYTES:-104857600}
    volumes:
      - documents:/var/lib/plantops/documents
      - investigation-diagnostics:/var/lib/plantops/investigation-diagnostics
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: plantops-web:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  investigation-diagnostics:
  database-data:
  documents:
  api-keys:
