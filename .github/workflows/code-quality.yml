name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plantops
          POSTGRES_PASSWORD: ci-test-password-only
          POSTGRES_DB: plantops_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantops -d plantops_tests"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PLANTOPS_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=plantops_tests;Username=plantops;Password=ci-test-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore PlantOps.sln --locked-mode
      - run: dotnet format PlantOps.sln --no-restore --verify-no-changes --exclude src/PlantOps.Infrastructure/Persistence/Migrations
      - run: dotnet build PlantOps.sln --no-restore
      - run: dotnet test PlantOps.sln --no-build --no-restore
      - run: npm ci
        working-directory: web
      - run: npm run format:check && npm run lint && npm run build && npm test
        working-directory: web
